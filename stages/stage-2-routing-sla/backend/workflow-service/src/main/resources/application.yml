spring:
  application:
    name: workflow-service

  datasource:
    url: jdbc:postgresql://localhost:5432/workflow
    username: workflow
    password: workflow

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: workflow-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode
        spring.json.trusted.packages: "*"
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/workflow

workflow:
  kafka:
    topic-process-events: workflow.process.events
    topic-task-events: workflow.task.events
    topic-sla-events: workflow.sla.events
    topic-dlq: workflow.events.dlq
    topic-request-accepted: request.request-accepted
    topic-definition-events: workflow.definition.events
    topic-notifications: workflow.notifications
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 5
  sla:
    scan-interval-ms: 30000
    # Non-working days on top of weekends; extend per production calendar.
    holidays:
      - 2026-01-01
      - 2026-01-02
      - 2026-01-07
      - 2026-03-09
      - 2026-05-01
      - 2026-05-11
      - 2026-06-12
      - 2026-11-04

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
