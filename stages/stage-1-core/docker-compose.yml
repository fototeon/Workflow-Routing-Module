name: workflow-stage-1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixes the hostname baked into every issued token/discovery doc to the browser-facing
      # address, so it matches what the frontend (running in the user's browser, not in the
      # compose network) expects. See workflow-service's jwk-set-uri vs issuer-uri split below.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

  workflow-service:
    build:
      context: ./backend/workflow-service
    ports:
      # Host port 8090 (container keeps listening on 8080 internally) — 8080 is commonly taken by
      # other local services. Adjust the left-hand side here if 8090 is also unavailable.
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow
      SPRING_DATASOURCE_USERNAME: workflow
      SPRING_DATASOURCE_PASSWORD: workflow
      # Tokens carry iss=http://localhost:8081/... (KC_HOSTNAME above); validate against that
      # exact string, but fetch the signing keys via the container-network address since this
      # service can't reach the host's localhost:8081 from inside the compose network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/workflow
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/workflow/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  workflow-ui:
    build:
      context: ./frontend/workflow-ui
    ports:
      - "5173:80"
    depends_on:
      - workflow-service

volumes:
  pgdata:
